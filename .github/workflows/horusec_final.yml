name: Security Scan

on: [push]

jobs:
  horusec-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 90 
    steps:
      - name: Checkout Benchmark Code
        uses: actions/checkout@v4
        with:
          path: benchmark

      - name: Checkout Fixed Horusec
        uses: actions/checkout@v4
        with:
          repository: 270942/horusec_fixed
          path: horusec-src

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Build Horusec
        run: |
          cd horusec-src/horusec
          go build -o ../../horusec_bin ./cmd/app/main.go
          cd ../..
          chmod +x ./horusec_bin

      - name: Run Analysis
        # Přidal jsem -D (disable docker) pro stabilitu RAM
        run: |
          ./horusec_bin start -p ./benchmark -o sarif -O ./results.sarif -t 3600 -D

      - name: Upload SARIF Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: horusec-report
          path: ./results.sarif
